name: interaction_foundation
description: Typed cross-platform interaction sound and haptic runtime.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^27.1.1

flutter:
  plugin:
    platforms:
      android:
        package: com.axr.interaction_foundation
        pluginClass: InteractionFoundationPlugin
      ios:
        pluginClass: InteractionFoundationPlugin
  assets:
    - assets/sounds/
